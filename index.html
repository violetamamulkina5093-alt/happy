<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>С днём рождения!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ff9a9e 100%);
    overflow: hidden;
    user-select: none;
  }

  h1 {
    color: #fff;
    font-size: 2.5rem;
    text-shadow: 2px 2px 6px rgba(180, 60, 60, 0.4);
    margin-bottom: 40px;
    text-align: center;
  }

  .stage {
    position: relative;
    width: 360px;
    height: 360px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gift {
    position: relative;
    width: 260px;
    height: 260px;
  }

  /* Корпус коробки */
  .box-body {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 180px;
    background: linear-gradient(145deg, #e74c3c, #c0392b);
    border-radius: 6px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
  }
  .box-body::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    width: 36px;
    height: 100%;
    transform: translateX(-50%);
    background: linear-gradient(145deg, #f1c40f, #d4ac0d);
  }

  /* Крышка */
  .box-lid {
    position: absolute;
    top: 60px;
    left: -10px;
    width: 280px;
    height: 60px;
    background: linear-gradient(145deg, #e74c3c, #c0392b);
    border-radius: 6px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    transform-origin: bottom left;
    transition: transform 0.8s cubic-bezier(0.5, -0.3, 0.4, 1.3);
    cursor: pointer;
    z-index: 3;
  }
  .box-lid::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 36px;
    transform: translateY(-50%);
    background: linear-gradient(145deg, #f1c40f, #d4ac0d);
  }

  .gift.opened .box-lid {
    transform: rotate(-110deg) translateY(-10px);
    pointer-events: none;
  }

  /* Бантик */
  .bow {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 80px;
    z-index: 4;
    cursor: pointer;
    transition: transform 0.6s ease, opacity 0.6s ease;
  }

  .bow-loop {
    position: absolute;
    top: 10px;
    width: 60px;
    height: 60px;
    background: radial-gradient(circle at 30% 30%, #f9e56a, #d4ac0d);
    border-radius: 50%;
    box-shadow: inset -4px -6px 10px rgba(0,0,0,0.15);
    transition: transform 0.6s ease, opacity 0.6s ease;
  }
  .bow-loop.left { left: 0; transform: rotate(-25deg); }
  .bow-loop.right { right: 0; transform: rotate(25deg); }

  .bow-knot {
    position: absolute;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 30px;
    background: radial-gradient(circle at 30% 30%, #f9e56a, #d4ac0d);
    border-radius: 8px;
    z-index: 2;
  }

  .bow-tail {
    position: absolute;
    top: 45px;
    width: 14px;
    height: 40px;
    background: linear-gradient(145deg, #f1c40f, #d4ac0d);
    transition: transform 0.6s ease, opacity 0.6s ease;
  }
  .bow-tail.left  { left: 40px;  transform: rotate(20deg); }
  .bow-tail.right { right: 40px; transform: rotate(-20deg); }

  .gift.unbowed .bow {
    transform: translateX(-50%) translateY(20px) scale(0.6);
    opacity: 0;
    pointer-events: none;
  }
  .gift.unbowed .bow-loop.left  { transform: rotate(-80deg) translateX(-40px); opacity: 0; }
  .gift.unbowed .bow-loop.right { transform: rotate(80deg)  translateX(40px);  opacity: 0; }
  .gift.unbowed .bow-tail.left  { transform: rotate(70deg)  translateY(30px);  opacity: 0; }
  .gift.unbowed .bow-tail.right { transform: rotate(-70deg) translateY(30px);  opacity: 0; }

  /* Внутренность коробки — подарок */
  .inside {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    width: 180px;
    height: 140px;
    background: #fff;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    opacity: 0;
    transition: transform 0.8s ease 0.3s, opacity 0.8s ease 0.3s;
    z-index: 2;
    box-shadow: 0 0 30px rgba(255,255,255,0.6);
    cursor: default;
  }
  .gift.opened .inside {
    transform: translateX(-50%) scale(1);
    opacity: 1;
    cursor: pointer;
  }

  /* Всплывающие сообщения "Неа!" и "Мимо!" */
  .popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: #fff;
    color: #c0392b;
    padding: 20px 40px;
    border-radius: 14px;
    font-size: 2rem;
    font-weight: bold;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    z-index: 100;
    opacity: 0;
    transition: transform 0.3s ease, opacity 0.3s ease;
    pointer-events: none;
  }
  .popup.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  /* Финальная надпись */
  .final-message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 3rem;
    color: #fff;
    font-weight: bold;
    text-shadow: 3px 3px 10px rgba(180, 60, 60, 0.7),
                 0 0 30px rgba(255, 255, 255, 0.6);
    opacity: 0;
    transition: transform 1s cubic-bezier(0.5, -0.3, 0.4, 1.3),
                opacity 1s ease;
    z-index: 200;
    pointer-events: none;
    text-align: center;
    padding: 20px 40px;
  }
  .final-message.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  .hint {
    margin-top: 30px;
    color: #fff;
    font-size: 1rem;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    opacity: 0.9;
  }
</style>
</head>
<body>

  <h1>С днём рождения! 🎉</h1>

  <div class="stage">
    <div class="gift" id="gift">
      <div class="inside" id="inside">🎁</div>
      <div class="box-body"></div>

      <div class="bow" id="bow" title="Нажми на бантик">
        <div class="bow-loop left"></div>
        <div class="bow-loop right"></div>
        <div class="bow-knot"></div>
        <div class="bow-tail left"></div>
        <div class="bow-tail right"></div>
      </div>

      <div class="box-lid" id="lid" title="Нажми на крышку"></div>
    </div>
  </div>

  <div class="hint" id="hint">Сначала развяжи бантик ✨</div>

  <div class="popup" id="popup"><span id="popupText"></span></div>
  <div class="final-message" id="finalMessage">Я тебя люблю, Кот! ❤️</div>

<script>
  const gift        = document.getElementById('gift');
  const bow         = document.getElementById('bow');
  const lid         = document.getElementById('lid');
  const inside      = document.getElementById('inside');
  const popup       = document.getElementById('popup');
  const popupText   = document.getElementById('popupText');
  const hint        = document.getElementById('hint');
  const finalMsg    = document.getElementById('finalMessage');

  let bowUntied   = false;
  let boxOpened   = false;
  let giftClicked = false;

  function showPopup(text, duration = 900) {
    popupText.textContent = text;
    popup.classList.add('show');
    clearTimeout(showPopup._t);
    showPopup._t = setTimeout(() => popup.classList.remove('show'), duration);
  }

  // Клик на бантик
  bow.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bowUntied) return;
    bowUntied = true;
    gift.classList.add('unbowed');
    hint.textContent = 'Теперь открой крышку 🎁';
  });

  // Клик на крышку
  lid.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!bowUntied) { showPopup('Неа!'); return; }
    if (boxOpened) return;
    boxOpened = true;
    gift.classList.add('opened');
    hint.textContent = 'Кликни по подарку 🎁';
  });

  // Клик по подарку внутри коробки
  inside.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!boxOpened || giftClicked) return;
    giftClicked = true;
    finalMsg.classList.add('show');
    hint.textContent = '❤️';
  });

  // Клик мимо нужного объекта на каждом этапе
  document.addEventListener('click', (e) => {
    if (giftClicked) return; // финал достигнут

    if (!bowUntied) {
      // Этап 1: ждём клик по бантику
      if (!bow.contains(e.target)) showPopup('Неа!');
      return;
    }

    if (!boxOpened) {
      // Этап 2: ждём клик по крышке
      if (!lid.contains(e.target)) showPopup('Неа!');
      return;
    }

    // Этап 3: ждём клик по подарку
    if (!inside.contains(e.target)) showPopup('Мимо!');
  });
</script>
</body>
</html>
